services:
  # =========================================================================
  # TogetherSpace Full-Stack Web Service (Backend API + Frontend SPA)
  # =========================================================================
  - type: web
    name: togetherspace
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_SETUP_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: togetherspace
      - key: MAX_IMAGE_FILE_SIZE
        value: "20971520"
      - key: MAX_VIDEO_FILE_SIZE
        value: "104857600"
